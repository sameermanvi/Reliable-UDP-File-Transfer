name: Build and network checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make -C src CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror' test
          python3 tests/test_controller.py
          python3 tests/test_metrics.py
      - name: Sanitizer checks
        if: runner.os == 'Linux'
        run: |
          make -C src clean
          make -C src CC=clang CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined' test

  network:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install network lab
        run: sudo bash scripts/setup_env.sh
      - name: Exercise normal, loss and link failure
        run: |
          sudo .venv/bin/python scripts/run.py experiment --repeats 1 --output results/ci
          sudo .venv/bin/python scripts/run.py experiment --scenarios link-failure --modes failover --flows 2 --repeats 1 --output results/ci-concurrent
          .venv/bin/python scripts/run.py plot results/ci/metrics.csv --output results/ci/plots
      - name: Save logs and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-results
          path: |
            results/ci/
            results/ci-concurrent/
