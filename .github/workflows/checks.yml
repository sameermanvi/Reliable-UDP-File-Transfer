name: Build and network checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sockets:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test CFLAGS='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror'
      - name: Sanitizers
        if: runner.os == 'Linux'
        run: |
          make clean
          make test CC=clang CFLAGS='-std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined' LDFLAGS='-fsanitize=address,undefined'
  mininet:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --build --rm demo python scripts/demo.py --repetitions 1 --mib 1 --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mininet-results
          path: results/ci/
